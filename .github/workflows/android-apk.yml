name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

# Keep native vault/archive/updater changes covered by a fresh APK build.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        id: signing-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gosha-notes-debug-signing-v2

      # Bootstrap the persistent signer exactly once. The follow-up workflow
      # locks this cache so a missing key fails instead of silently rotating it.
      - name: Bootstrap signing key on first run
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=GO$HA Android,O=GO$HA,C=LT"
          test -s "$HOME/.android/debug.keystore"

      - name: Verify signing key
        run: |
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:|Valid from:'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GO$HA-biometric-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest reinstall APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk gosha-notes.apk
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest gosha-notes.apk \
            --target "$GITHUB_SHA" \
            --title "GO$HA Android latest" \
            --notes "Latest GO$HA Android APK. The in-app Settings updater points to this release."
