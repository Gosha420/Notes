name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

# Keep native vault/archive/updater changes covered by a fresh APK build.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Never silently rotate the signing identity. If this cache disappears,
      # stop the build and require an explicit signing-key recovery decision.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gosha-notes-debug-signing-v2
          fail-on-cache-miss: true

      - name: Verify signing key
        run: |
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:|Valid from:'

      - name: Verify native update version metadata
        run: |
          python3 - <<'PY'
          import json, re, pathlib, sys
          gradle = pathlib.Path('android/app/build.gradle').read_text()
          manifest = json.loads(pathlib.Path('app-update.json').read_text())
          m = re.search(r'\bversionCode\s+(\d+)', gradle)
          if not m:
              sys.exit('Could not read Android versionCode')
          code = int(m.group(1))
          required = int(manifest.get('requiredNativeVersion', -1))
          if code != required:
              sys.exit(f'Native version mismatch: build.gradle={code}, app-update.json={required}')
          print(f'Native version metadata aligned at v{code}')
          PY

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK uses stable signer
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          KEY_FP="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          APK_FP="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$KEY_FP" && test "$KEY_FP" = "$APK_FP"
          echo "Verified APK signer SHA-256: $APK_FP"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GO$HA-biometric-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest reinstall APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk gosha-notes.apk
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest gosha-notes.apk \
            --target "$GITHUB_SHA" \
            --title "GO$HA Android latest" \
            --notes "Latest GO$HA Android APK. The in-app Settings updater points to this release."
