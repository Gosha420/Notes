plugins { id 'com.android.application' }

android {
    namespace 'com.gosha.notes'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gosha.notes'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
}
