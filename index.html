<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark"><meta name="application-name" content="GO$HA"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GO$HA"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>GO$HA</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="preload" as="image" href="./gosha-hero.png" fetchpriority="high"><style>:root{--bg:#000;--line:rgba(134,255,40,.12);--green:#86ff28;--text:#edf3eb;--muted:#778174}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Inter,system-ui,sans-serif}body{overflow-x:hidden}button,textarea,input{font:inherit}.app{min-height:100vh;padding-bottom:104px}.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;border-bottom:1px solid rgba(134,255,40,.07)}.hero:before{content:"";position:absolute;inset:-4%;background:linear-gradient(to bottom,transparent 54%,#000 97%),url('./gosha-hero.png') center/cover no-repeat}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 61%,rgba(0,0,0,.95));pointer-events:none}.app.revealed .hero{height:290px;min-height:290px}.main{width:min(980px,100%);margin:auto;padding:16px 12px 128px}.view{display:none}.view.active{display:block}.panel{border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#000}.panelHead{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid rgba(134,255,40,.08)}.panelHead h2{margin:0 auto 0 0;font-size:.73rem;letter-spacing:.18em}.status{font-size:.67rem;color:rgba(166,255,151,.48)}.btn{border:1px solid rgba(134,255,40,.17);border-radius:11px;background:rgba(134,255,40,.025);color:#dfe9dc;padding:9px 12px}.note{display:block;width:100%;min-height:61vh;resize:vertical;border:0;outline:0;background:#000;color:#e7ede5;padding:27px 24px 36px;line-height:1.64;font:500 16px/1.64 ui-monospace,monospace;caret-color:var(--green)}.settingsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.setting{border:1px solid rgba(134,255,40,.1);border-radius:18px;background:rgba(255,255,255,.012);padding:16px}.setting h3{margin:0 0 7px}.setting p{margin:0 0 13px;color:var(--muted);line-height:1.48}.bottomNav{position:fixed;z-index:100;bottom:max(10px,env(safe-area-inset-bottom));left:12px;right:12px;height:56px;border:1px solid rgba(134,255,40,.11);border-radius:18px;background:#010301;display:grid;grid-template-columns:repeat(2,1fr);overflow:hidden}.navBtn{border:0;background:transparent;color:#747e71}.navBtn.active{color:#dce8d8}.toast{position:fixed;z-index:200;left:50%;bottom:98px;transform:translate(-50%,10px);opacity:0;background:#080b07;border:1px solid rgba(134,255,40,.17);border-radius:999px;padding:9px 13px}.toast.show{opacity:1}</style><script src="./early-rescue.js?v=2" defer></script><script src="./app.js?v=63" defer></script><script src="./launch-fix.js?v=63" defer></script><script src="./success-reveal.js?v=63" defer></script><script src="./vault-loader.js?v=2" defer></script><script src="./native-archive-compat.js?v=63" defer></script><script src="./archive.js?v=65" defer></script><script src="./inventory-correction.js?v=1" defer></script><script src="./dashboard.js?v=64" defer></script><script src="./inclusive-dashboard.js?v=63" defer></script><script src="./dashboard-polish.js?v=63" defer></script><script src="./batch-stats.js?v=65" defer></script><script src="./update.js?v=66" defer></script><script src="./recovery-forensics.js?v=4" defer></script></head><body><div class="app" id="app"><header class="hero" id="hero"></header><main class="main"><section class="view active" id="notebookView" data-view="notebook"><div class="panel"><div class="panelHead"><h2>NOTES</h2><span class="status" id="saveStatus">LOCAL</span></div><textarea id="note" class="note" spellcheck="false"></textarea></div></section><section class="view" id="settingsView" data-view="settings"><div class="settingsGrid"><div class="setting"><h3>Local notebook</h3><p>Saved automatically on this device while you type.</p><button class="btn" id="exportBtn">Copy notebook</button></div></div></section></main><nav class="bottomNav"><button class="navBtn active" data-target="notebook">Notebook</button><button class="navBtn" data-target="settings">Settings</button></nav></div><div class="toast" id="toast"></div><script>(()=>{const n=document.getElementById('note');try{const s=localStorage.getItem('goshaNoteV21')??localStorage.getItem('goshaNote');if(s!==null)n.value=s}catch(_){}const vs=[...document.querySelectorAll('.view')],bs=[...document.querySelectorAll('.navBtn')];bs.forEach(b=>b.onclick=()=>{vs.forEach(v=>v.classList.toggle('active',v.dataset.view===b.dataset.target));bs.forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('exportBtn').onclick=async()=>{try{await navigator.clipboard.writeText(n.value)}catch(_){}};if('serviceWorker'in navigator)window.addEventListener('load',async()=>{try{const r=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});r.update().catch(()=>{})}catch(_){}},{once:true})})();</script></body></html>
