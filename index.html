<style>
:root{--bg:#000;--surface:#020402;--line:rgba(134,255,40,.12);--green:#86ff28;--text:#edf3eb;--muted:#778174;--radius:22px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{overflow-x:hidden}button,textarea{font:inherit}.app{min-height:100vh;background:#000;padding-bottom:104px}.hero{position:relative;height:100svh;min-height:560px;background:#000;overflow:hidden;border-bottom:1px solid rgba(134,255,40,.07)}.hero:before{content:"";position:absolute;inset:-4%;background:linear-gradient(to bottom,transparent 54%,#000 97%),url('./gosha-hero.png') center/cover no-repeat}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 61%,rgba(0,0,0,.95) 100%);pointer-events:none}.app.revealed .hero{height:290px;min-height:290px}.main{width:min(980px,100%);margin:0 auto;padding:16px 12px 128px}.view{display:none}.view.active{display:block}.panel{border:1px solid var(--line);border-radius:24px;overflow:hidden;background:linear-gradient(180deg,rgba(5,8,5,.98),#000 20%)}.panelHead{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid rgba(134,255,40,.08)}.panelHead h2{margin:0;margin-right:auto;font-size:.73rem;letter-spacing:.18em;color:#c6cec3;font-weight:700}.status{border:0;padding:7px 3px;font-size:.67rem;letter-spacing:.1em;color:rgba(166,255,151,.48);white-space:nowrap}.status:before{content:"• ";color:rgba(134,255,40,.7)}.btn{appearance:none;border:1px solid rgba(134,255,40,.17);border-radius:11px;background:rgba(134,255,40,.025);color:rgba(230,240,227,.82);padding:9px 12px}.btn.primary{border-color:rgba(134,255,40,.28);background:rgba(134,255,40,.055);color:#e8ffe2}.noteWrap{background:#000}.note{display:block;width:100%;min-height:61vh;resize:vertical;border:0;outline:0;background:#000;color:#e7ede5;padding:27px 24px 36px;line-height:1.64;font:500 16px/1.64 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;caret-color:var(--green);letter-spacing:.002em}.settingsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.setting{border:1px solid rgba(134,255,40,.1);border-radius:18px;background:rgba(255,255,255,.012);padding:16px}.setting h3{margin:0 0 7px;font-size:.95rem;letter-spacing:.01em}.setting p{margin:0 0 13px;color:var(--muted);line-height:1.48;font-size:.88rem}.bottomNav{position:fixed;z-index:100;bottom:max(10px,env(safe-area-inset-bottom));left:12px;right:12px;height:56px;border:1px solid rgba(134,255,40,.11);border-radius:18px;background:rgba(1,3,1,.95);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:hidden;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.navBtn{position:relative;border:0;border-right:1px solid rgba(134,255,40,.08);background:transparent;color:#747e71;font-size:.82rem}.navBtn:last-child{border-right:0}.navBtn.active{color:#dce8d8;background:rgba(134,255,40,.018)}.navBtn.active:after{content:"";position:absolute;left:28%;right:28%;bottom:0;height:1px;background:#86ff28;box-shadow:0 0 10px rgba(134,255,40,.42)}.toast{position:fixed;z-index:200;left:50%;bottom:98px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#080b07;border:1px solid rgba(134,255,40,.17);border-radius:999px;color:#dce8d9;padding:9px 13px;font-size:.78rem;transition:opacity .2s ease,transform .2s ease}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:520px){.main{padding-left:10px;padding-right:10px}.note{padding:25px 19px 34px}.panelHead{padding-left:15px;padding-right:15px}}
</style>
<script src="./app.js?v=57" defer></script>
<script src="./launch-fix.js?v=57" defer></script>

<body>
<div class="app" id="app"><header class="hero" id="hero" aria-label="GO$HA"></header><main class="main"><section class="view active" id="notebookView" data-view="notebook"><div class="panel"><div class="panelHead"><h2>NOTES</h2><span class="status" id="saveStatus">LOCAL</span></div><div class="noteWrap"><textarea id="note" class="note" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea></div></div></section><section class="view" id="settingsView" data-view="settings"><div class="settingsGrid"><div class="setting"><h3>Local notebook</h3><p>Saved automatically on this device while you type.</p><button class="btn" id="exportBtn" type="button">Copy notebook</button></div></div></section></main><nav class="bottomNav" aria-label="Main navigation"><button class="navBtn active" type="button" data-target="notebook">Notebook</button><button class="navBtn" type="button" data-target="settings">Settings</button></nav></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>(()=>{const note=document.getElementById('note');try{const saved=localStorage.getItem('goshaNoteV21')??localStorage.getItem('goshaNote');if(saved!==null)note.value=saved}catch(_){}const views=[...document.querySelectorAll('.view')],buttons=[...document.querySelectorAll('.navBtn')];function show(name){views.forEach(v=>v.classList.toggle('active',v.dataset.view===name));buttons.forEach(b=>b.classList.toggle('active',b.dataset.target===name))}buttons.forEach(b=>b.addEventListener('click',()=>show(b.dataset.target)));document.getElementById('exportBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(note.value);const t=document.getElementById('toast');t.textContent='Notebook copied';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1000)}catch(_){}});if('serviceWorker'in navigator)window.addEventListener('load',async()=>{try{const r=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});r.update().catch(()=>{})}catch(_){}},{once:true})})();</script>
</body>
