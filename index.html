<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="GO$HA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GO$HA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GO$HA</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preload" as="image" href="./gosha-hero.png" fetchpriority="high">
<style>
:root{--bg:#000;--panel:#050705;--line:#152014;--green:#86ff28;--text:#eef5ec;--muted:#7f8b7a;--radius:22px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{overflow-x:hidden}button,input,textarea{font:inherit}.app{min-height:100vh;background:#000;padding-bottom:86px}.hero{position:relative;height:100svh;min-height:560px;background:#000;overflow:hidden;border-bottom:1px solid #101810}.hero:before{content:"";position:absolute;inset:-4%;background:linear-gradient(to bottom,transparent 54%,#000 97%),url('./gosha-hero.png') center/cover no-repeat}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 60%,rgba(0,0,0,.94) 100%);pointer-events:none}.app.revealed .hero{height:290px;min-height:290px}.main{width:min(980px,100%);margin:0 auto;padding:18px 14px 110px}.view{display:none}.view.active{display:block}.panel{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}.panelHead{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line)}.panelHead h2{margin:0;margin-right:auto;font-size:.8rem;letter-spacing:.16em;color:#cbd5c8;font-weight:700}.status{border:1px solid #1d2d1a;border-radius:999px;padding:7px 10px;font-size:.7rem;color:#8ea489;white-space:nowrap}.btn{appearance:none;border:1px solid #20321c;border-radius:12px;background:#071006;color:#dce9d9;padding:9px 12px}.btn.primary{border-color:#31522b;color:#e7ffe1}.noteWrap{background:#000}.note{display:block;width:100%;min-height:56vh;resize:vertical;border:0;outline:0;background:#000;color:#e8eee8;padding:24px;line-height:1.58;font-size:16px;caret-color:var(--green)}.searchBox{display:flex;gap:10px;margin-bottom:14px}.searchBox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;background:#030503;color:var(--text);padding:13px 14px;outline:none}.searchResults{border:1px solid var(--line);border-radius:18px;background:#030503;overflow:hidden}.searchEmpty{padding:22px;color:var(--muted)}.searchHit{padding:12px 14px;border-bottom:1px solid #111a10;white-space:pre-wrap;word-break:break-word}.searchHit:last-child{border-bottom:0}.settingsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.setting{border:1px solid var(--line);border-radius:18px;background:#030503;padding:16px}.setting h3{margin:0 0 7px;font-size:1rem}.setting p{margin:0 0 12px;color:var(--muted);line-height:1.45}.bottomNav{position:fixed;z-index:100;bottom:max(10px,env(safe-area-inset-bottom));left:12px;right:12px;height:58px;border:1px solid var(--line);border-radius:18px;background:#030503;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden}.navBtn{border:0;border-right:1px solid var(--line);background:transparent;color:#879484}.navBtn:last-child{border-right:0}.navBtn.active{color:#dfffd8;background:#091207}.toast{position:fixed;z-index:200;left:50%;bottom:88px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#0a0e09;border:1px solid #263823;border-radius:999px;color:#dce8d9;padding:9px 13px;font-size:.8rem;transition:opacity .2s ease,transform .2s ease}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.main{padding-left:10px;padding-right:10px}.note{padding:22px 18px}.panelHead{padding-left:14px;padding-right:14px}}
</style>
<script>try{document.documentElement.dataset.boot='1'}catch(_){}</script>
<script src="./app.js?v=43" defer></script>
</head>
<body>
<div class="app" id="app">
  <header class="hero" id="hero" aria-label="GO$HA"></header>
  <main class="main">
    <section class="view active" id="notebookView" data-view="notebook">
      <div class="panel">
        <div class="panelHead"><h2>NOTES</h2><span class="status" id="saveStatus">LOCAL</span></div>
        <div class="noteWrap"><textarea id="note" class="note" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea></div>
      </div>
    </section>
    <section class="view" id="searchView" data-view="search">
      <div class="searchBox"><input id="searchInput" type="search" placeholder="Search notes" autocomplete="off"><button class="btn" id="clearSearch" type="button">Clear</button></div>
      <div class="searchResults" id="searchResults"><div class="searchEmpty">Type to search your notebook.</div></div>
    </section>
    <section class="view" id="settingsView" data-view="settings">
      <div class="settingsGrid">
        <div class="setting"><h3>Local notebook</h3><p>Your notebook is saved automatically on this device while you type.</p><button class="btn" id="exportBtn" type="button">Copy notebook</button></div>
      </div>
    </section>
  </main>
  <nav class="bottomNav" aria-label="Main navigation">
    <button class="navBtn active" type="button" data-target="notebook">Notebook</button>
    <button class="navBtn" type="button" data-target="search">Search</button>
    <button class="navBtn" type="button" data-target="settings">Settings</button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
  const note=document.getElementById('note');
  try{const saved=localStorage.getItem('goshaNoteV21')??localStorage.getItem('goshaNote');if(saved!==null)note.value=saved}catch(_){}

  const views=[...document.querySelectorAll('.view')],buttons=[...document.querySelectorAll('.navBtn')];
  function show(name){views.forEach(v=>v.classList.toggle('active',v.dataset.view===name));buttons.forEach(b=>b.classList.toggle('active',b.dataset.target===name));if(name==='search')setTimeout(()=>document.getElementById('searchInput')?.focus(),50)}
  buttons.forEach(b=>b.addEventListener('click',()=>show(b.dataset.target)));

  const input=document.getElementById('searchInput'),results=document.getElementById('searchResults');
  function search(){const q=input.value.trim().toLowerCase();if(!q){results.innerHTML='<div class="searchEmpty">Type to search your notebook.</div>';return}const hits=note.value.split(/\r?\n/).filter(x=>x.toLowerCase().includes(q));results.replaceChildren();if(!hits.length){results.innerHTML='<div class="searchEmpty">No matches.</div>';return}hits.slice(0,100).forEach(line=>{const d=document.createElement('div');d.className='searchHit';d.textContent=line;results.appendChild(d)})}
  input.addEventListener('input',search);
  document.getElementById('clearSearch').addEventListener('click',()=>{input.value='';search();input.focus()});

  document.getElementById('exportBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(note.value);const t=document.getElementById('toast');t.textContent='Notebook copied';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1000)}catch(_){}});

  if('serviceWorker' in navigator){
    window.addEventListener('load',async()=>{
      try{
        const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
        registration.update().catch(()=>{});
      }catch(_){}
    },{once:true});
  }
})();
</script>
</body>
</html>
